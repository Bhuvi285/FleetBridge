server:
  port: 8082

spring:
  application:
    name: fleetbridge-fleet-service
  datasource:
    url: jdbc:postgresql://localhost:5432/fleetbridge_fleet_db
    username: fleetbridge_user
    password: fleetbridge_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/fleetbridge-master
          jwk-set-uri: http://localhost:8080/realms/fleetbridge-master/protocol/openid-connect/certs
