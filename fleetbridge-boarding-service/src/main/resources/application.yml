server:
  port: 8085

spring:
  application:
    name: fleetbridge-boarding-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/fleetbridge_boarding_db
    username: fleetbridge_user
    password: fleetbridge_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/fleetbridge-master
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/fleetbridge-master/protocol/openid-connect/certs

logging:
  level:
    com.fleetbridge.boarding: DEBUG
