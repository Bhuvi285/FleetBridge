server:
  port: 9090

spring:
  application:
    name: fleetbridge-api-gateway
  cloud:
    gateway:
      routes:
        - id: org-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/org/**
        - id: fleet-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/fleet/**
        - id: trip-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/trip/**
        - id: gps-service-rest
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/gps/**
        - id: gps-service-websocket
          uri: ws://localhost:8084
          predicates:
            - Path=/ws/telemetry/**
        - id: boarding-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/boarding/**
      
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
            
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/fleetbridge-master
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/fleetbridge-master/protocol/openid-connect/certs

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
