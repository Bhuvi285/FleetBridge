server:
  port: 9090

spring:
  application:
    name: fleetbridge-api-gateway
  cloud:
    gateway:
      routes:
        - id: org-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/org/**
        - id: fleet-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/fleet/**
        - id: trip-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/trip/**
            
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/fleetbridge-master
          jwk-set-uri: http://localhost:8080/realms/fleetbridge-master/protocol/openid-connect/certs

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
