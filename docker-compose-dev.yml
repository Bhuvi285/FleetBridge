services:
  # 1. PostgreSQL (Central DB for microservices)
  postgres:
    image: postgres:16-alpine
    container_name: fleetbridge-postgres
    environment:
      POSTGRES_USER: fleetbridge_user
      POSTGRES_PASSWORD: fleetbridge_password
      POSTGRES_DB: fleetbridge_master
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped
    networks:
      - fleetbridge-network

  # 2. Redis (Caching & QR Validation)
  redis:
    image: redis:7.2-alpine
    container_name: fleetbridge-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    networks:
      - fleetbridge-network

  # 3. Keycloak (Identity Provider for OIDC/OAuth2)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: fleetbridge-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: fleetbridge_user
      KC_DB_PASSWORD: fleetbridge_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak-import:/opt/keycloak/data/import
    command: start-dev --import-realm
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - fleetbridge-network

  # 4. Kafka (Event Broker, KRaft Mode)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: fleetbridge-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafkadata:/var/lib/kafka/data
    restart: unless-stopped
    networks:
      - fleetbridge-network

networks:
  fleetbridge-network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  kafkadata:
